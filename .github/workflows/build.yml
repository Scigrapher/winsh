name: Build winsh.exe

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOOS: windows
  GOARCH: amd64

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Build winsh.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/winsh.exe ./cmd/winsh

          $hash = (Get-FileHash dist/winsh.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  winsh.exe" | Set-Content dist/winsh.exe.sha256 -Encoding ascii

      - name: Smoke test
        run: |
          .\dist\winsh.exe --version
          .\dist\winsh.exe --self-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: winsh-windows-amd64
          path: |
            dist/winsh.exe
            dist/winsh.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: winsh-windows-amd64
          path: dist

      - name: Attach winsh.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/winsh.exe
            dist/winsh.exe.sha256
          generate_release_notes: true
